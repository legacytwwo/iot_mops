services:
  rule_engine:
    image: ${RULE_ENGINE_IMAGE}
    env_file:
      - rule_engine.env
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      - RABBIT_URL=amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - "${RULE_ENGINE_PORT}:8080"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - iot_net

networks:
  iot_net:
    external: true
    name: iot_net
